<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Port de plaisance Russell</title>
</head>
<body>

    <h1>Bienvenue au Port de plaisance Russell</h1>

    <h2>Connexion</h2>

    <form id="loginForm">
        <label for="email">Adresse e-mail :</label>
        <input type="email" id="email" name="email" required>

        <br><br>

        <label for="password">Mot de passe :</label>
        <input type="password" id="password" name="password" required>

        <br><br>

        <button type="submit">Se connecter</button>
    </form>

    <p id="message"></p>

    <hr>

    <p>
        <a href="/api-docs">Consulter la documentation de l'API</a>
    </p>

<script>
    // Récupérer le formulaire HTML
    const loginForm = document.getElementById('loginForm');
    const message = document.getElementById('message');

    // Détecter le clic sur "Se connecter"
    loginForm.addEventListener('submit', async (event) => {
        event.preventDefault();

        // Récupérer les informations saisies
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        try {
            // Envoyer les informations à mon API
            const response = await fetch('/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    email: email,
                    password: password
                })
            });
            if (response.ok) {
            window.location.href = '/dashboard';
            return;
            }

            const data = await response.json();

            if (response.ok) {
                message.textContent = 'Connexion réussie ! Bienvenue ' + data.user.username;
                message.style.color = 'green';
            } else {
                message.textContent = data.message;
                message.style.color = 'red';
            }

        } catch (error) {
            message.textContent = 'Erreur de connexion au serveur';
            message.style.color = 'red';
        }
    });
</script>
</body>
</html>
